replicaCount: 2

image:
  repository: ghcr.io/your-org/automobile-platform/auth-api
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: auth-api.autocompany.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: auth-api-tls
      hosts:
        - auth-api.autocompany.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: auth-api-secrets
        key: jwt-secret
  - name: JWT_ALGORITHM
    value: "HS256"
  - name: JWT_EXPIRATION_HOURS
    value: "24"

configMap:
  data:
    LOG_LEVEL: "INFO"
    ENVIRONMENT: "production"

secrets:
  jwt-secret: "your-secret-key-change-in-production"

livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5