apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: automobile-platform
  description: Modern connected-car platform with microservices architecture
spec:
  owner: automobile-team
  domain: automotive

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: auth-api
  description: Authentication and authorization microservice
  annotations:
    github.com/project-slug: your-org/automobile-platform
    backstage.io/kubernetes-id: auth-api
    backstage.io/kubernetes-namespace: auth-api-prod
spec:
  type: service
  lifecycle: production
  owner: security-team
  system: automobile-platform
  providesApis:
    - auth-api
  dependsOn:
    - resource:jwt-secret

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: users-api
  description: User profiles management microservice
  annotations:
    github.com/project-slug: your-org/automobile-platform
    backstage.io/kubernetes-id: users-api
    backstage.io/kubernetes-namespace: users-api-prod
spec:
  type: service
  lifecycle: production
  owner: user-management-team
  system: automobile-platform
  providesApis:
    - users-api
  consumesApis:
    - auth-api

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: vehicles-api
  description: Vehicle data management microservice
  annotations:
    github.com/project-slug: your-org/automobile-platform
    backstage.io/kubernetes-id: vehicles-api
    backstage.io/kubernetes-namespace: vehicles-api-prod
spec:
  type: service
  lifecycle: production
  owner: vehicle-team
  system: automobile-platform
  providesApis:
    - vehicles-api
  consumesApis:
    - auth-api

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-api
  description: Car order management microservice
  annotations:
    github.com/project-slug: your-org/automobile-platform
    backstage.io/kubernetes-id: orders-api
    backstage.io/kubernetes-namespace: orders-api-prod
spec:
  type: service
  lifecycle: production
  owner: sales-team
  system: automobile-platform
  providesApis:
    - orders-api
  consumesApis:
    - auth-api
    - vehicles-api

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payments-api
  description: Transaction processing microservice
  annotations:
    github.com/project-slug: your-org/automobile-platform
    backstage.io/kubernetes-id: payments-api
    backstage.io/kubernetes-namespace: payments-api-prod
spec:
  type: service
  lifecycle: production
  owner: payments-team
  system: automobile-platform
  providesApis:
    - payments-api
  consumesApis:
    - auth-api

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dealer-portal
  description: Dealer-facing web frontend
  annotations:
    github.com/project-slug: your-org/automobile-platform
    backstage.io/kubernetes-id: dealer-portal
    backstage.io/kubernetes-namespace: dealer-portal-prod
spec:
  type: website
  lifecycle: production
  owner: frontend-team
  system: automobile-platform
  consumesApis:
    - auth-api
    - users-api
    - vehicles-api
    - orders-api
    - payments-api

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: auth-api
  description: Authentication and authorization API
spec:
  type: openapi
  lifecycle: production
  owner: security-team
  system: automobile-platform
  definition: |
    openapi: 3.0.0
    info:
      title: Auth API
      version: 1.0.0
      description: Authentication and authorization microservice
    paths:
      /healthz:
        get:
          summary: Health check
          responses:
            '200':
              description: Service is healthy
      /auth/login:
        post:
          summary: User login
          responses:
            '200':
              description: Login successful
      /auth/register:
        post:
          summary: User registration
          responses:
            '200':
              description: Registration successful

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: automobile-team
  description: Automobile Platform Development Team
spec:
  type: team
  children:
    - security-team
    - user-management-team
    - vehicle-team
    - sales-team
    - payments-team
    - frontend-team

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: platform-admin
spec:
  memberOf:
    - automobile-team