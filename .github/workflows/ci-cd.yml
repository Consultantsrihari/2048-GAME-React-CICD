name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth-api: ${{ steps.changes.outputs.auth-api }}
      users-api: ${{ steps.changes.outputs.users-api }}
      vehicles-api: ${{ steps.changes.outputs.vehicles-api }}
      orders-api: ${{ steps.changes.outputs.orders-api }}
      payments-api: ${{ steps.changes.outputs.payments-api }}
      inventory-api: ${{ steps.changes.outputs.inventory-api }}
      telemetry-api: ${{ steps.changes.outputs.telemetry-api }}
      geofence-api: ${{ steps.changes.outputs.geofence-api }}
      notifications-api: ${{ steps.changes.outputs.notifications-api }}
      billing-api: ${{ steps.changes.outputs.billing-api }}
      reports-api: ${{ steps.changes.outputs.reports-api }}
      dealer-portal: ${{ steps.changes.outputs.dealer-portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            auth-api:
              - 'auth-api/**'
            users-api:
              - 'users-api/**'
            vehicles-api:
              - 'vehicles-api/**'
            orders-api:
              - 'orders-api/**'
            payments-api:
              - 'payments-api/**'
            inventory-api:
              - 'inventory-api/**'
            telemetry-api:
              - 'telemetry-api/**'
            geofence-api:
              - 'geofence-api/**'
            notifications-api:
              - 'notifications-api/**'
            billing-api:
              - 'billing-api/**'
            reports-api:
              - 'reports-api/**'
            dealer-portal:
              - 'dealer-portal/**'

  test-and-build:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          auth-api,
          users-api,
          vehicles-api,
          orders-api,
          payments-api,
          inventory-api,
          telemetry-api,
          geofence-api,
          notifications-api,
          billing-api,
          reports-api,
          dealer-portal
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if service changed
        id: check-changes
        run: |
          if [ "${{ needs.detect-changes.outputs[matrix.service] }}" == "true" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check-changes.outputs.changed == 'true' && matrix.service != 'dealer-portal'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        if: steps.check-changes.outputs.changed == 'true' && matrix.service == 'dealer-portal'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        if: steps.check-changes.outputs.changed == 'true' && matrix.service != 'dealer-portal'
        working-directory: ./${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Node.js dependencies
        if: steps.check-changes.outputs.changed == 'true' && matrix.service == 'dealer-portal'
        working-directory: ./${{ matrix.service }}
        run: npm ci

      - name: Run Python tests
        if: steps.check-changes.outputs.changed == 'true' && matrix.service != 'dealer-portal'
        working-directory: ./${{ matrix.service }}
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=xml

      - name: Run Node.js tests
        if: steps.check-changes.outputs.changed == 'true' && matrix.service == 'dealer-portal'
        working-directory: ./${{ matrix.service }}
        run: npm test -- --coverage --watchAll=false

      - name: Lint Python code
        if: steps.check-changes.outputs.changed == 'true' && matrix.service != 'dealer-portal'
        working-directory: ./${{ matrix.service }}
        run: |
          black --check src/
          isort --check-only src/
          flake8 src/

      - name: Lint Node.js code
        if: steps.check-changes.outputs.changed == 'true' && matrix.service == 'dealer-portal'
        working-directory: ./${{ matrix.service }}
        run: |
          npm run lint
          npm run type-check

      - name: Log in to Container Registry
        if: steps.check-changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check-changes.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: steps.check-changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: [detect-changes, test-and-build]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-west-2 --name automobile-dev-cluster

      - name: Deploy to Development
        run: |
          helm upgrade --install auth-api ./charts/auth-api \
            --namespace auth-api-dev --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set environment=development
          
          helm upgrade --install users-api ./charts/users-api \
            --namespace users-api-dev --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set environment=development

          # Deploy other services...

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [detect-changes, test-and-build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-west-2 --name automobile-prod-cluster

      - name: Deploy to Production
        run: |
          helm upgrade --install auth-api ./charts/auth-api \
            --namespace auth-api-prod --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set environment=production
          
          helm upgrade --install users-api ./charts/users-api \
            --namespace users-api-prod --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set environment=production

          # Deploy other services...